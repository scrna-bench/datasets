# Export-only conda route for envs/r (the rv project builds the image). Solved
# separately from rv, so package versions can differ from the image.
[workspace]
channels = ["conda-forge", "bioconda", "https://prefix.dev/almost-conductor"]
platforms = ["linux-64"]
name = "datasets-r-conda"

[dependencies]
r-base = "4.5.*"
r-jsonlite = "==2.0.0"
r-obkit = "==0.0.4"
bioconductor-singlecellexperiment = "==1.32.0"
bioconductor-anndatar = "==1.0.2"
bioconductor-rhdf5 = "==2.54.1"
bioconductor-geoquery = "==2.78.0"
bioconductor-dropletutils = "==1.30.0"
bioconductor-singlecellmultimodal = "==1.22.0"
bioconductor-tenxbraindata = "==1.30.0"
